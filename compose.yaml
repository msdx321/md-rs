name: md-rs

services:
  md-rs:
    image: ${MEDIA_IMAGE:-md-rs:local}
    build: .
    ports:
      - "${MEDIA_HOST:-127.0.0.1}:${MEDIA_PORT:-8080}:${MEDIA_PORT:-8080}"
    environment:
      TZ: ${TZ:-UTC}
      MEDIA_PORT: ${MEDIA_PORT:-8080}
      RUST_LOG: ${RUST_LOG:-warn,md_rs=info}
    volumes:
      # Keep SQLite/WAL, browser profiles and active temporary files on local SSD.
      - ${MEDIA_DATA_PATH:-./data}:/data
      # Only completed media belongs on NAS/HDD. Defaults preserve existing data.
      - ${MEDIA_DOWNLOADS_PATH:-${MEDIA_DATA_PATH:-./data}/downloads}:/data/downloads
    # Chromium uses shared memory instead of temporary-file-backed renderer IPC.
    shm_size: 1gb
    stop_grace_period: 2m
    restart: unless-stopped
