<details id="logs-panel" class="logs-panel">
  <summary>Application logs <span id="logs-scope" class="muted">All modules</span></summary>
  <div class="logs-body">
    <div class="logs-toolbar">
      <label class="field logs-search">Search logs<input id="logs-search" type="search" placeholder="Message or source"></label>
      <label class="field">Module<select id="logs-module">
        <option value="">All modules</option>
        <option value="telegram">Telegram</option>
        <option value="jav">JAV</option>
        <option value="p91">91Porn</option>
      </select></label>
      <label class="field">Minimum level<select id="logs-level">
        <option value="">All levels</option>
        <option value="ERROR">ERROR</option>
        <option value="WARN">WARN+</option>
        <option value="INFO">INFO+</option>
        <option value="DEBUG">DEBUG+</option>
        <option value="TRACE">TRACE+</option>
      </select></label>
      <button id="logs-pause" type="button" aria-pressed="false">Pause</button>
    </div>
    <div class="logs-meta"><span id="logs-status" role="status">Open to load logs</span><span>Latest 1,000 entries · Cleared on restart</span></div>
    <div id="logs-output" class="logs-output" role="region" aria-label="Application log entries" tabindex="0"><p class="empty">Loading logs…</p></div>
  </div>
</details>
