name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["CI and container publishing"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Merge tested Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$PR_NUMBER" || exit 0
          pr="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          jq -e --arg sha "$CHECKED_SHA" --arg repo "$GH_REPO" '
            .state == "open" and
            .user.login == "dependabot[bot]" and
            .head.repo.full_name == $repo and
            .head.sha == $sha
          ' <<< "$pr" > /dev/null || exit 0
          gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$CHECKED_SHA"
