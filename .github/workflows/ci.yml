name: CI and container publishing

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_NAMESPACE: ${{ secrets.DOCKER_HUB_USERNAME || github.repository_owner }}

concurrency:
  # Serialize runs for the same commit; only tag pushes publish images.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan CI and release
    # Release preparation commits are validated by the tag run instead.
    if: >-
      !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
        startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      environment: ${{ steps.plan.outputs.environment }}
      publish: ${{ steps.plan.outputs.publish }}
      validated: ${{ steps.reuse.outputs.validated }}
    steps:
      - uses: actions/checkout@v7
      - name: Determine validation and release mode
        id: plan
        env:
          PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "IMAGE=docker.io/${DOCKER_NAMESPACE,,}/md-rs" >> "$GITHUB_ENV"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          definition=$(awk '/^# Application build$/ {exit} {print}' Dockerfile | sha256sum | cut -d ' ' -f 1)
          echo "environment=$definition" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" != true ]]; then
            echo "### CI only" >> "$GITHUB_STEP_SUMMARY"
            echo "Run Rust checks; no release binary or container publishing." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.publish == 'true'
      - uses: docker/login-action@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Check for an already-published release of this commit
        id: reuse
        if: steps.plan.outputs.publish == 'true'
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          digest=$(bash .github/scripts/find-validated-image.sh)
          echo "validated=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            if [[ -n "$digest" ]]; then
              echo "Reuse the already-validated image for $COMMIT ($digest); skip Rust checks and builds."
            else
              echo "No reusable published image for $COMMIT. This is normal for a new release, not a build failure."
              echo "Run Rust checks, build or restore tested binaries, then package and publish containers."
            fi
            echo ""
            echo "This lookup is separate from the build-environment, Cargo, binary, and Docker-layer caches."
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Rust checks
    needs: plan
    if: needs.plan.outputs.validated == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-environment
        id: environment
        with:
          arch: amd64
      - name: Configure build environment
        env:
          IMAGE: ${{ steps.environment.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-home"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
          echo "BUILD_ENV_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - run: bash .github/scripts/in-build-env.sh cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          cmd-format: bash .github/scripts/in-build-env.sh {0}
          env-vars: BUILD_ENV_IMAGE
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - run: bash .github/scripts/in-build-env.sh cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: bash .github/scripts/in-build-env.sh cargo test --locked --all-targets --all-features

  build:
    name: Binary and container (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.validated == ''
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # Keep the secret-derived image name within this job: GitHub drops it from job outputs.
      - name: Set image name
        run: echo "IMAGE=docker.io/${DOCKER_NAMESPACE,,}/md-rs" >> "$GITHUB_ENV"
      - name: Restore tested binary
        id: binary
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/release-output
          # No fallback: skipping compilation/tests requires identical inputs.
          # GitHub caches are ref-scoped: this mainly helps retries of the same tag.
          key: release-binary-${{ matrix.arch }}-${{ needs.plan.outputs.environment }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', 'src/**', 'web/**', '.cargo/**', 'rust-toolchain*', '.github/scripts/build-release.sh', '.github/scripts/in-build-env.sh') }}
      - uses: docker/login-action@v4
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-environment
        id: environment
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          arch: ${{ matrix.arch }}
          publish: 'true'
      - name: Configure build environment
        if: steps.binary.outputs.cache-hit != 'true'
        env:
          BUILD_IMAGE: ${{ steps.environment.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-home"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"
          echo "BUILD_ENV_IMAGE=$BUILD_IMAGE" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          shared-key: rust-release
          cmd-format: bash .github/scripts/in-build-env.sh {0}
          env-vars: BUILD_ENV_IMAGE
          cache-bin: false
          cache-workspace-crates: true
          cache-on-failure: true
          save-if: 'true'
      - name: Test and compile release binary
        if: steps.binary.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-release.sh
      - name: Summarize binary reuse
        env:
          CACHE_HIT: ${{ steps.binary.outputs.cache-hit }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### Release binary ($ARCH)"
            if [[ "$CACHE_HIT" == true ]]; then
              echo "Exact binary cache hit: restored a tested binary; skipped compilation and release tests."
            else
              echo "Exact binary cache miss: ran release tests and compiled the binary using the Cargo cache when available."
            fi
            echo "Docker packaging uses this binary directly and caches runtime layers separately."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save tested binary
        if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/release-output
          key: ${{ steps.binary.outputs.cache-primary-key }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Package tested binary into container (no Rust compilation)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-contexts: |
            builder=${{ runner.temp }}/release-output
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.commit }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max,compression=zstd
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform container
    needs: [plan, check, build]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.publish == 'true' &&
      (needs.plan.outputs.validated != '' ||
       (needs.build.result == 'success' && needs.check.result == 'success'))
    runs-on: ubuntu-24.04
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - name: Set image name
        run: echo "IMAGE=docker.io/${DOCKER_NAMESPACE,,}/md-rs" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.validated == ''
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=validated-${{ env.COMMIT }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Publish manifest
        env:
          METADATA: ${{ steps.meta.outputs.json }}
          REUSE: ${{ needs.plan.outputs.validated }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          if [[ -n "$REUSE" ]]; then
            args+=("$IMAGE@$REUSE")
          else
            args+=(--annotation "index:org.opencontainers.image.revision=$COMMIT")
            args+=(--annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY")
            for digest in "$RUNNER_TEMP"/digests/*; do args+=("$IMAGE@sha256:${digest##*/}"); done
          fi
          docker buildx imagetools create "${args[@]}"

  release:
    name: Publish GitHub release
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          args=(--title "md-rs ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$prerelease" --verify-tag)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
