[package]
name = "media-jav"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
description = "MissAV daily popular-video downloader with a web UI"
license = "MIT"

[dependencies]
media-runtime.workspace = true
media-config.workspace = true
media-storage.workspace = true
wreq = { workspace = true, features = ["stream", "gzip", "brotli", "deflate", "zstd"] }
wreq-util.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
axum = { workspace = true, features = ["json", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
regex.workspace = true
url.workspace = true
dom_query.workspace = true
aes.workspace = true
cbc.workspace = true
futures-util.workspace = true
chrono.workspace = true
percent-encoding.workspace = true
# Drives a real Chrome over CDP to clear Cloudflare's managed challenge and mint
# a fresh `cf_clearance` cookie. Core to the design, not an add-on.
headless_chrome.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

