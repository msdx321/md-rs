[package]
name = "media-telegram"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
authors = ["msdx321 <msdx321@gmail.com>", "tangyoha <tangyoha@outlook.com>"]
description = "Telegram Media Downloader - native Rust port"
license = "MIT"

[dependencies]
media-runtime.workspace = true
media-migration.workspace = true
media-config.workspace = true
media-storage.workspace = true
indicatif.workspace = true
grammers-client = { workspace = true, features = ["fs", "parse_invite_link", "proxy"] }
grammers-session.workspace = true
grammers-mtsender.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
chrono.workspace = true
regex.workspace = true
rustc-hash.workspace = true
axum.workspace = true
serde_json.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }

